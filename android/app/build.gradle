plugins {
    id 'com.android.application'
}

android {
    namespace 'com.schar.limud'
    compileSdk 34

    defaultConfig {
        applicationId "com.schar.limud"
        minSdk 21
        targetSdk 34
        // ⛔ versionCode לעולם אינו יורד (סבב 46ב) — מספר נמוך ממה
        // שמותקן במכשיר חוסם את העדכון.
        // 1 = the first shell, loading the live site (https://ygtotlrl-lab.github.io/schar-limud/)
        // from day one — schar-limud never had a file:// build.
        // 2 = סבב 41 — יישור שכבת הבנייה והחילוץ של המעטפת לתבנית
        // משותפת. ⛔ כל שינוי תחת android/ מחייב קידום כאן,
        // ו-tools/test_round40_gradle.mjs אוכף זאת מול origin/main.
        // 3 = סבב 45 — יישור `AndroidManifest.xml` (`configChanges` לסופרסט)
        // ואכיפת חתימה על החלק המשותף של המניפסט ושל קובץ הבנייה.
        // 4 = סבב 46ב — היפוך ברירת המחדל בקובצי התצורה: חתימה חסרת-גשר
        // על המניפסט ועל קובץ הבנייה, וחתימה אחת לשני ה-workflows.
        versionCode 7
        versionName "7.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No dependencies, on purpose: yoman's shell needs androidx.webkit + androidx.core for
// its origin-restricted share bridge (navigator.share → FileProvider). schar-limud's
// page has no navigator.share, the bridge is omitted entirely, and nothing androidx
// is used. See MainActivity.java.
