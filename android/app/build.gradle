// נוצר מהתצורה — app.config.js, ב-node tools/gen-app.mjs: אין לערוך ביד
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.schar.limud'
    compileSdk 34

    defaultConfig {
        applicationId "com.schar.limud"
        minSdk 21
        targetSdk 34
        versionCode 25
        versionName "15.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // מסך הפתיחה — אותו מסך בכל גרסאות האנדרואיד, והמעטפת מחזיקה אותו עד שהמסך הראשון צויר
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
