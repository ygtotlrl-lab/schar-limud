}

  for (var i = 0; i < kids.length; i++) {
    var k = kids[i], arr = MIRROR[k.t] || [], c = 0;
    for (var j = 0; j < arr.length; j++) {

      arr[j] = pcChildKill(parent, arr[j]);

  return n;
}

function slPayload(tbl, row) {
  var cols = SL_COLS[tbl] || [], out = {};
  cols.forEach(function (c) { if (row[c] !== undefined) out[c] = row[c]; });
  return out;
}

// upsert על מזהה שנוצר במכשיר — ניסיון חוזר אחרי תשובה שאבדה מעדכן ואינו מכפיל, ובכסף שורה כפולה היא תשלום כפול

async function slSendRows(tbl, rows) {

// הכפתור אינו מושבת כאן — actRun מנטרל אותו עד שההבטחה נגמרת, והשבתה שנייה היא מסלול שני
function showAuthErr(m){document.getElementById('auth-err').textContent=m;document.getElementById('auth-spinner').classList.remove('on');}
function startAuthLoad(){document.getElementById('auth-err').textContent='';document.getElementById('auth-spinner').classList.add('on');}
// select של עמודות מפורשות ולא * — הסיסמה אינה מגיעה לזיכרון
// אין כאן אכיפת פורמט שש ספרות — היא הייתה נועלת בחוץ סיסמה תקפה שנקבעה לפני התקן, בלי מסלול שחזור
async function doLogin(){
  var u=document.getElementById('au-user').value.trim(),p=document.getElementById('au-pass').value;
  if(!u||!p){showAuthErr(MSG_FILL_LOGIN);return;}
  if(!navigator.onLine){ return doLoginOffline(u,p); }
  startAuthLoad();
  try{
    // השורה נשלפת לפי שם המשתמש בלבד וההשוואה מול הטביעה — סינון לפי password היה הופך את הסיסמה הגלויה למפתח הכניסה, קריא לכל מי שמחזיק את מפתח ה-anon
    var r=await SB.from(authUsersTable()).select(AUTH_USER_COLS.join(',')).eq('username',u).maybeSingle();
    if(r.error)throw r.error;
    if(r.data){
      var vOn=await authVerify(r.data,p);
      // אין למזג את המצבים — «אין למשתמש טביעה» אינו «סיסמה שגויה», והודעה מאוחדת שולחת להקליד שוב סיסמה נכונה
      if(vOn==='no-crypto'){ authLog(false,'no_crypto_online',u); showAuthErr(MSG_NO_CRYPTO); return; }
      // אין עמודת סיסמה במסד — משתמש נולד עם טביעה, ומשתמש בלי טביעה מקבל הודעה משלו
      if(vOn==='no-fp'){ authLog(false,'no_fp_online',u); showAuthErr(MSG_NO_FP_ONLINE); return; }
      else if(vOn!=='ok'){ authLog(false,'wrong_credentials_online',u); showAuthErr(MSG_BAD_LOGIN); return; }
    }
    if(!r.data){
      // טבלה ריקה היא התקנה שטרם נוצר בה משתמש ולא סיסמה שגויה; אין משתמש ברירת מחדל — סיסמה ידועה לכל היא חשבון פתוח
      authLog(false,'wrong_credentials_online',u);
      var any=await SB.from(authUsersTable()).select('client_id').limit(1);
      showAuthErr((any&&!any.error&&Array.isArray(any.data)&&!any.data.length)?MSG_NO_USERS:MSG_BAD_LOGIN);
      return;
    }
    var pub=usersSanitize(r.data)[0];
    // השורה נכנסת למראה מיד — המשיכה המלאה שברקע עשויה לא להגיע ברשת שנפלה, והמראה היא מסלול הכניסה האופליין
    usersSaveOne(pub);
    ctxSwitch();
    sessSet(pub);
    authLog(true,'online',u);
    document.getElementById('auth-spinner').classList.remove('on');
    enterApp();
  }catch(e){
    // navigator.onLine משקר לא פעם ב-WebView — בכשל רשת מנסים אופליין ולא מציגים שגיאה
    authLog(false,isNetErr(e)?'net_error':'server_error',u);
    if(isNetErr(e)) return doLoginOffline(u,p);
    // .auth-err שמור למה שהמשתמש יכול לתקן בהקלדה — כשל מערכת עובר בטוסט, והמשטח מתאפס כדי שהטופס יהיה שמיש
    showAuthErr('');
    toast(MSG_LOGIN_ERR+((e&&e.message)||MSG_SERVER_ERR),null,'bad');
  }
}

// מחזירה Promise שאיש בקוד אינו נשען עליו — הבדיקות ממתינות לה, וגזירת PBKDF2 אסינכרונית
async function doLoginOffline(u,p){
  var cu=usersByName(u);
  if(!cu){ authLog(false,'unknown_user_offline',u); showAuthErr(MSG_OFF_UNKNOWN); return; }
  startAuthLoad();
  var verdict;
  try{ verdict=await authVerify(cu,p); }
  catch(e){ console.warn('[login] אימות אופליין נכשל',e); authLog(false,'no_crypto_offline',u); showAuthErr(MSG_OFF_NO_CRYPTO); return; }
  if(verdict==='no-fp'){ authLog(false,'no_fp_offline',u); showAuthErr(MSG_OFF_NO_FP); return; }
  if(verdict==='no-crypto'){ authLog(false,'no_crypto_offline',u); showAuthErr(MSG_OFF_NO_CRYPTO); return; }
  if(verdict!=='ok'){ authLog(false,'wrong_credentials_offline',u); showAuthErr(MSG_BAD_LOGIN); return; }
  ctxSwitch();
  sessSet(usersSanitize(cu)[0]);
  authLog(true,'offline',u);
  document.getElementById('auth-spinner').classList.remove('on');
  enterApp();
  toast(MSG_OFFLINE_LOGIN,5000, 'bad');
}

// ── המשתמש המחובר ──
// הסשן בזיכרון בלבד — סשן ב-localStorage בלי תפוגה משאיר מחובר לנצח על מכשיר משותף ומוריד את role לדיסק
// המראה מנצחת כשהמשתמש קיים בה — היא מתרעננת בכל משיכה ותופסת שינוי תפקיד ממכשיר אחר
function slResolveUser(sess){

// שומר חפיפה — ברשת איטית קריאה חדשה נוחתת לפני שהקודמת חזרה
// משוחרר ב-finally ולא בסוף ה-try — דגל שנשאר דלוק אחרי כשל מקפיא את הסנכרון לתמיד
var _syncBusy=false,_syncWarned=false,_lastSyncOk=false;
var SYNC_LABELS=['תלמידים','תשלומים','הגדרות','רשימות'];
// שליפה בעמודים חייבת סדר יציב — בלי ORDER BY פוסטגרס אינו מבטיח אותו
// עמודה שאינה בסכימה מחזירה 42703, שנקרא «סכימה מיושנת»; sl_settings ממוינת ב-key כי אין לה id
var SYNC_TABLES=[['sl_students','client_id'],['sl_transactions','client_id'],[KV_TABLE,'key'],['sl_lists','client_id']];
// הסנכרון מושך מלא — רשומה שלא נמשכה נקראת במיזוג כנמחקה
// המשיכה מעומדת — select('*') בבקשה אחת נחתך בשקט בתקרת db-max-rows
function slPullAll(){
  return Promise.all(SYNC_TABLES.map(function(e){
    return _rowsPaged(function(){ return SB.from(e[0]).select('*'); }, e[1], null)
      .then(function(rows){ return rows ? {data:rows,error:null} : {data:null,error:{message:'rows:'+e[0]}}; });
  }));
}
// ── סנכרון ──
// משיכה לפני דחיפה — דחיפה עיוורת מחזירה לחיים רשומות שנמחקו במכשיר אחר
// דוחפים רק לקטגוריה שנמשכה בהצלחה
async function syncAll(){
  if(_syncBusy) return;
  _syncBusy=true;
  var _t0=Date.now(); // סימון שנוצר אחרי תחילת המחזור אינו מוכרע בו
  // המשתמש יכול להתחלף בין המשיכה לכתיבה — מה שנמזג עבור הקודם היה יורד לדיסק ועולה לענן בהקשר של החדש
  var _ep=ctxEpoch();
  try{
    var rs=await slPullAll();
    if(ctxStale(_ep)) return;
    // supabase-js אינו זורק בכשל אלא מחזיר error — catch לבדו כאן הוא קוד מת, ולכן כל תוצאה נבדקת במפורש.
    var errs=[];
    for(var i=0;i<rs.length;i++){ if(!rs[i]||rs[i].error||!Array.isArray(rs[i].data)) errs.push(SYNC_LABELS[i]); }
    _lastSyncOk=!errs.length;

    // ממוזגת רק קטגוריה שנמשכה בהצלחה — מיזוג מול ענן ריק שנובע מכשל רשת נראה כמחיקה של הכול.
    var remoteStu={}, remoteTxn={}, remoteSet={}, remoteLst={};
    var pulledStu=false, pulledTxn=false, pulledSet=false, pulledLst=false;
    if(rs[0]&&!rs[0].error&&Array.isArray(rs[0].data)){
      pulledStu=true;
      rs[0].data.forEach(function(r){ remoteStu[slKey(r)]=r; });
      MIRROR.sl_students=slMerge(MIRROR.sl_students,rs[0].data,function(k){return pendHas(PK_STU+k);}); mirrorSave('sl_students');
    }
    if(rs[1]&&!rs[1].error&&Array.isArray(rs[1].data)){
      pulledTxn=true;
      rs[1].data.forEach(function(r){ remoteTxn[slKey(r)]=r; });
      hwNoteCloud(mirrorKey('sl_transactions'), rs[1].data);
      MIRROR.sl_transactions=slMerge(MIRROR.sl_transactions,rs[1].data,function(k){return pendHas(PK_TXN+k);}); mirrorSave('sl_transactions');
    }
    // slStripSecrets רץ לפני המיזוג — admin_pass אינה נכנסת למראה בשום מסלול.
    if(rs[2]&&!rs[2].error&&Array.isArray(rs[2].data)){
      pulledSet=true;
      var setRows=slStripMeta(rs[2].data);
      setRows.forEach(function(r){ remoteSet[slKeyOf(KV_TABLE,r)]=r; });
      MIRROR[KV_TABLE]=slMerge(MIRROR[KV_TABLE],setRows,function(k){return pendHas(PK_SET+k);},function(r){return slKeyOf(KV_TABLE,r);}); mirrorSave(KV_TABLE);
    }
    if(rs[3]&&!rs[3].error&&Array.isArray(rs[3].data)){
      pulledLst=true;
      rs[3].data.forEach(function(r){ remoteLst[slKey(r)]=r; });
      MIRROR.sl_lists=slMerge(MIRROR.sl_lists,rs[3].data,function(k){return pendHas(PK_LST+k);}); mirrorSave('sl_lists');
    }
    slApplyMirror();
    pullRender(refreshUI);

    // נדחפת רק טבלה שנמשכה בהצלחה — בלי תמונת הענן, דחיפה עיוורת מחזירה לחיים שורה שנמחקה במכשיר אחר.
    // קטגוריה שלא נמשכה נמסרת כ-null ולא כמפה ריקה — מפה ריקה נקראת «הענן ריק» ומסמנת את עד הפינוי.
    if(ctxStale(_ep)) return;
    var _pushRes=await pushDirty({
      sl_students:     pulledStu?remoteStu:null,
      sl_transactions: pulledTxn?remoteTxn:null,
      [KV_TABLE]:      pulledSet?remoteSet:null,
      sl_lists:        pulledLst?remoteLst:null
    });
    // שניים משלושת תנאי זריקת העידן נמדדים רק בתוצאת הדחיפה הזו.
    eraNotePush(_pushRes);
    var stillPending=_pushRes.still;
    // הסריקה מורידה סימון מכל מה שאינו ב-still — ולכן רצה רק כשכל הקטגוריות נמשכו, אחרת ההורדה היא הסקה ולא ראיה.
    if(ctxStale(_ep)) return;
    if(pulledStu&&pulledTxn&&pulledSet&&pulledLst) pendSyncScan(stillPending,_t0);
    // מראת המשתמשים אינה נדחפת לעולם — היא מחזיקה טביעות בלבד, ודחיפה שלה הייתה כותבת password ריק לכל המשתמשים.
    usersRefresh();

    if(!errs.length){
      _slLastPullOk=Date.now();
      // אין כאן כתיבת עד פינוי — חותמת משיכה אומרת «ראיתי את הענן» ולא «מה שאצלי עלה לשם».
      if(!_slPullLogged){_slPullLogged=true;slSyncLog('pull',null,null);}
    }
    // אזהרה פעם אחת בלבד — הסנכרון רץ כל 3 שניות.
    if(errs.length){
      console.error('[sync] נכשלו:',errs.join(', '));
      if(!_syncWarned){_syncWarned=true;toast(MSG_LOAD_FAIL_PRE+errs.join(', ')+MSG_LOAD_FAIL_POST,4000, 'bad');}
    }else if(_syncWarned){_syncWarned=false;toast(MSG_SYNC_BACK, null, 'good');}
  }catch(e){
    _lastSyncOk=false;
    console.error('[sync]',e);
    if(!_syncWarned){_syncWarned=true;toast(errMsg(e),4000,'bad');}
  }finally{_syncBusy=false;}
}

// אין לרשום כל מחזור סנכרון — syncAll רץ אחרי כל שמירה, ו-sh_sync_log היא יומן insert בלבד שאי-אפשר לדלל.

// ── לוח הבקרה ──
// כל חודש מציג את סך התנועות לפי תאריך התנועה, בלי פריסה — השאלה כאן היא «כמה נגבה בחודש הזה».
// תנועה בסעיף CREDIT_METHOD אינה כסף שהתקבל ואינה נכנסת לסכום.
function txnMonth(t){var d=new Date(t.date+'T00:00:00');return d.getMonth();}
// הגדרה שלא נקבעה היא 0 ולא ניחוש — סכום מומצא מוצג כחוב אמיתי ונכתב לענן בשמירה הראשונה של ההגדרות.
function studentTuition(s){
  var cs=(s&&s.card_settings)||{},defT=(parseInt(SETTINGS['default_tuition'],10)||0);
  return cs.monthly_tuition?parseInt(cs.monthly_tuition):defT;
}
// {student_client_id:{monthIdx:סכום}} — תנועות בפועל בלבד, בלי זיכויים.
function actualByMonth(year){
  var map={};
  TRANSACTIONS.forEach(function(t){
    if(isCreditTxn(t)||!t.date||acadYearOf(t.date)!==year)return;
    var a=parseFloat(t.amount)||0;if(!a)return;
    var m=txnMonth(t);if(isNaN(m))return;

// הפריסה היא תור תשלומים לפי תאריך ולא בריכה — כך כל שקל יודע מאיזו תנועה בא, ואפשר לפצל cash מול cred.
// paid = cash + cred.
function calcDistribution(sid,year){
  var s=STUDENTS.find(function(x){return idEq(x.client_id, sid);});if(!s)return{};
  var cs=s.card_settings||{},defT=(parseInt(SETTINGS['default_tuition'],10)||0),stuT=cs.monthly_tuition?parseInt(cs.monthly_tuition):defT;
  var txns=TRANSACTIONS.filter(function(t){return t.student_client_id===sid&&acadYearOf(t.date)===year;}).sort(function(a,b){return a.date>b.date?1:-1;});
  var total=txns.reduce(function(a,t){return a+(parseFloat(t.amount)||0);},0),result={};
  var idx=0,left=0,EPS=1e-6;
  function draw(n){
    var cash=0,cred=0;
    while(n>EPS&&idx<txns.length){
      if(left<=EPS){left=Math.max(0,parseFloat(txns[idx].amount)||0);if(left<=EPS){idx++;continue;}}
      var t=Math.min(n,left);
      if(isCreditTxn(txns[idx]))cred+=t;else cash+=t;
      left-=t;n-=t;
      if(left<=EPS)idx++;
    }
    return {cash:cash,cred:cred};
  }
  var used=0;
  // הדגל off מבחין בין חודש שאינו מחויב לחודש מחויב שלא שולם.
  YEAR_MONTHS.forEach(function(m){
    if(!studentInMonth(s,year,m)){result[m]={req:0,paid:0,cash:0,cred:0,off:true};return;}
    var d=draw(stuT),paid=Math.round((d.cash+d.cred)*100)/100;
    used+=paid;
    result[m]={req:stuT,paid:paid,cash:Math.round(d.cash*100)/100,cred:Math.round(d.cred*100)/100,off:false};
  });
  // העודף הוא יתרת זכות בשדה נפרד — ולא חוב שלילי בשום סיכום.
  result.credit=Math.max(0,Math.round((total-used)*100)/100);
  return result;
}

function renderScAnnual(){
  if(!SC_STUDENT_ID||!SC_YEAR)return;
  var s=STUDENTS.find(function(x){return idEq(x.client_id, SC_STUDENT_ID);});if(!s)return;
  var cs=s.card_settings||{},defT=(parseInt(SETTINGS['default_tuition'],10)||0),stuT=cs.monthly_tuition?parseInt(cs.monthly_tuition):defT;
  var dist=calcDistribution(SC_STUDENT_ID,SC_YEAR),rows='',tR=0,tP=0;
  YEAR_MONTHS.forEach(function(m){
    var i=dist[m]||{req:stuT,paid:0};
    if(i.off){rows+='<tr class="month-off"><td class="month-cell">'+monthLabel(SC_YEAR,m)+'</td><td class="off-cell req-cell" colspan="3">לא היה בישיבה</td></tr>';return;}
    var b=i.paid-i.req;tR+=i.req;tP+=i.paid;var bc=b>=0?'amt-ok':i.paid>0?'amt-warn':'amt-bad';
    rows+='<tr><td class="month-cell">'+monthLabel(SC_YEAR,m)+'</td><td class="req-cell">'+fmt(i.req)+'</td><td class="paid-cell">'+fmt(i.paid)+'</td><td class="bal-cell '+bc+'">'+(b>=0?'+':'')+fmt(b)+'</td></tr>';
  });

  // חוב משנים קודמות מוזן ידנית ואינו נגרר אוטומטית — המנהל קובע מה נגרר.
  // הוא אינו מתווסף לסה"כ השנה — כדי שיובחן חוב שנולד השנה מחוב שנגרר.
  var pd=parseInt(cs.prev_debt)||0;

  document.getElementById('sc-annual-tfoot').innerHTML=tf;
  // יתרת זכות מוצגת בשורה נפרדת ובצבע נפרד — אינה נכנסת ל«סה״כ שולם» ואינה מקזזת את שורת החוב.
  var cr=distCredit(dist),applied=distCredApplied(dist),ce=document.getElementById('sc-credit'),ch='';
  if(cr>0)ch+='<div class="credit-note"><span>&#128142; יתרת זכות</span><span>&#8362;'+fmt(cr)+'</span></div>'+
    '<div class="credit-sub">שולם מעבר לסך החיוב בטווח החודשים של התלמיד בשנה זו. אינה חוב שלילי ואינה מקוזזת מסך החוב. לניצולה בשנה הבאה — רשום תשלום באמצעי «'+esc(CREDIT_METHOD)+'».</div>';
  if(applied>0)ch+='<div class="credit-applied credit-sub">↩ מזה זיכוי על חשבון יתרת זכות: &#8362;'+fmt(applied)+' — הקטין את החוב אך אינו כסף שהתקבל (גבייה בפועל בשנה זו: &#8362;'+fmt(Math.round((tP-applied)*100)/100)+').</div>';
  if(ce)ce.innerHTML=ch;
  var yt=TRANSACTIONS.filter(function(t){return t.student_client_id===SC_STUDENT_ID&&acadYearOf(t.date)===SC_YEAR;}).sort(function(a,b){return a.date>b.date?-1:1;});
  document.getElementById('sc-txn-list').innerHTML=yt.map(function(t){return'<div class="txn-row'+(isCreditTxn(t)?' credit':'')+'"><span class="txn-date">'+esc(t.date)+'</span>'+pendTxnTag(t)+'<span class="txn-note">'+esc(t.note||'—')+'</span>'+txnAmountHtml(t)+txnMethodPill(t)+'<button class="btn sm danger" data-act="txn-del" data-id="'+esc(slKey(t))+'">&#10005;</button></div>';}).join('')||'<div class="empty">אין תשלומים בשנה זו</div>';

// פיירפוקס אינו תומך ב-input[type=month] ונופל לטקסט חופשי — ולכן הערך מאומת כאן ולא רק במסד.
function readMonthRange(startId,endId){
  var rawS=(document.getElementById(startId).value||'').trim(),rawE=(document.getElementById(endId).value||'').trim();
  var sm=normMonth(rawS),em=normMonth(rawE);
  if(rawS&&!sm){toast(MSG_START_MONTH_BAD, null, 'bad');return null;}
  if(rawE&&!em){toast(MSG_END_MONTH_BAD, null, 'bad');return null;}
  if(sm&&em&&em<sm){toast(MSG_END_BEFORE_START, null, 'bad');return null;}
  return {start_month:sm||null,end_month:em||null};
}
function saveStudentSettings(){
  var name=document.getElementById('sc-edit-name').value.trim(),tuition=document.getElementById('sc-edit-tuition').value,section=document.getElementById('sc-edit-section').value;
  if(!name){toast(MSG_NAME_REQUIRED, null, 'bad');return;}
  var rng=readMonthRange('sc-edit-start','sc-edit-end');if(!rng)return;
  var s=STUDENTS.find(function(x){return idEq(x.client_id, SC_STUDENT_ID);});if(!s){toast(MSG_STUDENT_MISSING2, null, 'bad');return;}
  var cs=Object.assign({},s.card_settings||{});
  // אימות מפורש — שדה טקסט מעביר קלט פגום כמות שהוא, ו-parseInt בלי אימות כותב NaN לתוך card_settings.
  var tuitionVal=parseInt(tuition,10);
  if(tuition&&(!isFinite(tuitionVal)||tuitionVal<0)){toast(MSG_TUITION_POSITIVE, null, 'bad');return;}
  if(tuition)cs.monthly_tuition=tuitionVal;else delete cs.monthly_tuition;
  if(section)cs.section=section;else delete cs.section;
  var debtRaw=document.getElementById('sc-edit-debt').value,debtNote=document.getElementById('sc-edit-debt-note').value.trim();
  var debtVal=parseInt(debtRaw);
  if(debtRaw&&(!isFinite(debtVal)||debtVal<0)){toast(MSG_DEBT_POSITIVE, null, 'bad');return;}
  if(debtRaw&&debtVal>0)cs.prev_debt=debtVal;else delete cs.prev_debt;
  if(debtNote)cs.prev_debt_note=debtNote;else delete cs.prev_debt_note;
  var row=Object.assign({},s,{name:name,card_settings:cs,start_month:rng.start_month,end_month:rng.end_month});
  if(!slLocalWrite('sl_students',row)){toast(MSG_SETTINGS_NOT_SAVED,5000, 'bad');return;}
  pendMark(pendStuKey(row));
  return true;
}

// אין שער סיסמה נפרד מעל מסך ההגדרות — ההרשאה נגזרת מתפקיד המשתמש המחובר, ושער כזה נופל בהתקנה טרייה לברירת מחדל שכל אחד מקליד.
// אין לזרוע ברירת מחדל לסיסמה או לתפקיד — role הוא NOT NULL בלי DEFAULT, וכל מה שאינו בדיוק 'admin' נדחה.
// אין כאן קריאת רשת — התפקיד יורד עם מראת המשתמשים, ולכן ההרשאה עובדת אופליין כמו הכניסה.
function showPanel(key,btn){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});

function renderSettingsPanel(){
  var acc=slSettingsAccess(), ok=(acc==='ok');

  if(denied)denied.classList.toggle('hidden',ok);
  if(main)main.classList.toggle('hidden',!ok);

    var m=document.getElementById('set-denied-msg');

function renderSettingsLists(){
  // יתרת הזכות לשנת הלימודים הנוכחית — שדה נפרד שאינו מעורבב בשום סיכום חוב.
  var cy=acadYearOf(dayToday());

  renderListItems('payment_methods','set-methods-list');renderListItems('sections','set-sections-list');

// סעיף הזיכוי מוצג נעול, בלי כפתור מחיקה — מחיקתו מסתירה אותו מהטופס ומונעת רישום זיכויים חדשים.
// הסיווג ההיסטורי אינו נשען על הפריט — הוא נקרא מהמחרוזת ששמורה על התנועה.
function renderListItems(cat,elId){document.getElementById(elId).innerHTML=(LISTS[cat]||[]).map(function(i){
  if(isCreditValue(i.value))return'<div class="set-list-item"><span>'+esc(i.value)+'</span><span class="pill credit" title="סעיף מערכת — משמש לסימון ניצול יתרת זכות ואינו נספר כהכנסה. לא ניתן למחיקה.">&#128274; סעיף מערכת</span></div>';
  return'<div class="set-list-item"><span>'+esc(i.value)+'</span>'+pendLstTag(i)+'<button class="btn sm danger" data-act="list-del" data-id="'+esc(i.key)+'">&#10005;</button></div>';
}).join('')||'<div class="empty">ריק</div>';}
// client_id נוצר במכשיר לפני השליחה — בלעדיו ניסיון חוזר אחרי תשובה שאבדה ברשת יוצר שורה שנייה.
function addListItem(cat){
  var v=prompt('הזן ערך חדש:');
  if(!v||!v.trim())return;
  var val=v.trim();
  // ההשוואה על הערך ולא על client_id — הרשימה מזינה בוררים, ושתי אפשרויות באותו טקסט אינן ניתנות להבחנה.
  if(uniqHas(LISTS[cat]||[], {value:val}, function(it){return it.value;})){toast(MSG_VALUE_EXISTS,4000, 'bad');return;}
  var row={client_id:newClientId(),category:cat,value:val,deleted:false,deleted_at:null,deleted_by:null};
  if(!slLocalWrite('sl_lists',row)){toast(MSG_ITEM_SAVE_FAIL,5000, 'bad');return;}
  pendMark(pendLstKey(row));
  return true;
}
// מחיקה פיזית מקומית חוזרת מהענן בסנכרון הבא — היעדר רשומה אצל צד אחד אינו מחיקה.
function deleteListItem(key){
  // חסימה מפורשת ולא כשל שקט — הכפתור עשוי להופיע מרינדור ישן.
  var it=findListItem(key);
  if(it&&isCreditValue(it.value)){toast('⚠️ «'+CREDIT_METHOD+MSG_CREDIT_ITEM_LOCKED,4200, 'bad');return;}
  ask(MSG_DEL_ITEM_TITLE,MSG_DEL_ITEM_BODY,MSG_CONFIRM).then(function(yes){
    if(!yes)return;
    var r0=(MIRROR.sl_lists||[]).filter(function(x){return slKey(x)===String(key);})[0];
    if(!r0){toast(MSG_ITEM_MISSING, null, 'bad');return;}
    var row=Object.assign({},r0,{deleted:true,deleted_at:tombAt(),deleted_by:slWhoName()});
    if(!slLocalWrite('sl_lists',row)){toast(MSG_DEL_NOT_SAVED,5000, 'bad');return;}
    pendMark(pendLstKey(row));
    refreshUI();
    toast(navigator.onLine?MSG_DELETED_OK:MSG_SAVED_LOCAL,4000, 'good');
    schedulePush();
  });}

// ── עליית האפליקציה ──
// כל הפעלות המודולים המשותפים יושבות כאן — הפעלה שתלויה במסלול אחר, כמו משיכה שהצליחה, נכבית בשקט כשהמסלול אינו רץ.
async function slBoot(){
  // המכסה משותפת ל-origin כולו — גם אפליקציה שכמעט אינה כותבת נפגעת ממה שאחרות מילאו, ולכן מודדים בעלייה.
  try { lsBoot(); } catch (e) { console.warn('[ls] lsBoot', e); }
  // הסימונים נטענים לפני הכניסה — רשומה שלא אושרה בסשן הקודם חייבת להיראות ככזו גם אחרי רענון.
  try { pendBoot(); } catch (e) { console.warn('[pend] pendBoot', e); }
  try { tombBoot(); } catch (e) { console.warn('[tomb] tombBoot', e); }
  try { eraKick(); } catch (e) { console.warn('[era] eraKick', e); }
  // כאן ולא אחרי הכניסה — הגיבוי אינו תלוי בכניסה, ורץ גם במכשיר שנשאר במסך הכניסה.
  try { bkBoot(); } catch (e) { console.warn('[bk] bkBoot', e); }
  try { rtyBoot(); } catch (e) { console.warn('[rty] rtyBoot', e); }
  try { lkBoot(); } catch (e) { console.warn('[lk] lkBoot', e); }
  try { plBoot(); } catch (e) { console.warn('[pl] plBoot', e); }
  try { hwBoot(); } catch (e) { console.warn('[hw] hwBoot', e); }
  // העותק המקומי נטען ראשון — לפני כל נגיעה ברשת.
  try { mirrorBoot(); slApplyMirror(); } catch (e) { console.warn('[mirror] load', e); }
  // מראת המשתמשים נטענת לפני מסך הכניסה — אחרת לכניסה אופליין אין מול מה לאמת.
  try { usersSaveAll(mirrorLoadOne(authUsersTable()) || []); } catch (e) { console.warn('[users] load', e); }
  // אין כאן שחזור סשן — סשן שנשמר בלי תפוגה הוא כניסה קבועה על מכשיר משותף.

  slShowLogin(true);
  setTimeout(function(){document.getElementById('au-user').focus();},50);
  bootOk();
}
document.addEventListener('DOMContentLoaded', slBoot);
