<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#307535">
<title></title>
<link rel="manifest" href="manifest.json">
<script src="app.config.js"></script>
<script src="core/boot.js"></script>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.837fbb2e.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.c7721cea.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.aa306d87.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<!-- גרסאות CDN נעוצות — גרסה צפה מכניסה שחרור של הספק בלי בדיקה, ושבירה כזו אינה ניתנת לשחזור מהריפו -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js" crossorigin="anonymous"></script>
<link rel="stylesheet" href="core/ui.css">
<link rel="stylesheet" href="core/chart.css">
<link rel="stylesheet" href="app/style.css">
</head>
<body>
<!-- הקליפה מתחילה חשופה, והמסגרת נחשפת רק יחד עם הלוחות — לא בטעינה ולא בכניסה -->
<div id="main-app" class="is-bare">
  <div id="topnav">
    <span class="nav-title">שכר לימוד</span>
    <span class="nav-user">
      <span id="nav-username"></span>
      <button class="nav-logout" data-act="logout">יציאה</button>
    </span>
  </div>

  <div id="tabbar">
    <button class="tab-btn active" data-act="show-panel" data-panel="dash">
      <span class="ti">&#128202;</span><span>לוח בקרה</span>
    </button>
    <button class="tab-btn" data-act="show-panel" data-panel="txn">
      <span class="ti">&#128179;</span><span>תשלום</span>
    </button>
    <button class="tab-btn" data-act="show-panel" data-panel="student">
      <span class="ti">&#128100;</span><span>תלמיד</span>
    </button>
    <button class="tab-btn" data-act="show-panel" data-panel="settings">
      <span class="ti">&#9881;</span><span>הגדרות</span>
    </button>
  </div>

  <main id="view"><div class="view-loading" role="status" aria-label="טוען"><span class="view-spin"></span></div></main>
</div>

<div id="modal" class="veil">
  <div class="sheet ksave" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-hd">
      <h3 id="modal-title"></h3>
      <button class="x" data-act="modal-close" aria-label="סגירה">✕</button>
    </div>
    <div class="sheet-bd" id="modal-body"></div>
    <div class="sheet-ft" id="modal-foot"></div>
  </div>
</div>
<div id="ask" class="veil">
  <div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="sheet-hd"><h3 id="ask-title"></h3></div>
    <div class="sheet-bd" id="ask-body"></div>
    <div class="sheet-ft">
      <button data-act="ask-no">ביטול</button>
      <button class="danger" data-act="ask-yes" id="ask-yes">אישור</button>
    </div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="updater">
  <div class="in">
    <span>🔄 גרסה חדשה זמינה</span>
    <button data-act="sw-apply">עדכן עכשיו</button>
    <button class="x" data-act="sw-dismiss" aria-label="סגור">✕</button>
  </div>
</div>
<script type="module" src="app/main.js"></script>
</body>
</html>
